name: CI

on:
  push:
    branches: [master, agents/**]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Korp_Teste_Gabriel.slnx

      - name: Build
        run: dotnet build Korp_Teste_Gabriel.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Korp.Tests/Korp.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: Korp.Tests/TestResults/*.trx

  frontend:
    name: Frontend (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Korp-Frontend-Gabriel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Korp-Frontend-Gabriel/package-lock.json

      - name: Install npm version from packageManager
        run: npm install -g npm@11.6.2 --silent --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx ng test --watch=false

  e2e:
    name: Integration + E2E (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ['10.0.x', '6.0.x']

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Korp-Frontend-Gabriel/package-lock.json

      - name: Install npm version from packageManager
        run: npm install -g npm@11.6.2 --silent --no-audit --no-fund

      - name: Install Playwright
        run: npm ci --silent --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: Korp-Frontend-Gabriel

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5090/health && curl -sf http://localhost:5164/health; then
              echo "APIs healthy";
              exit 0;
            fi
            sleep 5;
          done
          echo "APIs not healthy after 300s" && exit 1

      - name: Integration tests
        run: dotnet test Korp.Estoque.API/IntegrationTests.csproj -c Release

      - name: E2E tests
        run: npx playwright test
        working-directory: Korp-Frontend-Gabriel

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Stop stack
        if: always()
        run: docker compose down -v