server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sempre fresco para os usuarios receberem o bundle mais recente
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # assets com hash podem ser cacheados por muito tempo
    location ~* \.(js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Optional: proxy api requests to backend (adjust if needed)
    location /api/ {
        proxy_pass http://faturamento:5164;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
