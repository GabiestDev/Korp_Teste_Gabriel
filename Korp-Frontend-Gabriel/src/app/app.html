<div class="app-layout">
  <header class="topbar">
    <div class="brand">
      <h1>Sistema Korp</h1>
      @if (autenticado) {
        <span class="brand-user">Olá, {{ usuarioNome }}</span>
      }
    </div>

    <nav class="nav" aria-label="Navegação principal">
      @if (autenticado) {
        <a mat-button routerLink="/notas-fiscais" routerLinkActive="active-link">Notas Fiscais</a>
        <a mat-button routerLink="/produtos" routerLinkActive="active-link">Produtos</a>
        <a mat-button (click)="sair()">Sair</a>
      }
    </nav>
  </header>

  <main class="content-shell">
    <router-outlet></router-outlet>

    <footer class="site-footer" role="contentinfo">
      <small>Sistema desenvolvido por <a href="https://www.linkedin.com/in/gabriel-neto-do-nascimento/" target="_blank" rel="noopener noreferrer">Gabriel Neto</a></small>
    </footer>
  </main>
</div>
