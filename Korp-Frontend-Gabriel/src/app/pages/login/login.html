<section class="page-card login-card">
  <div class="page-header">
    <h2>Acesso ao Sistema</h2>
  </div>

  @if (mensagemErro) {
    <p class="login-error" role="alert">{{ mensagemErro }}</p>
  }

  <div class="login-form">
    <mat-form-field appearance="outline" class="field-wide">
      <mat-label>Username</mat-label>
      <input matInput [(ngModel)]="username" (keydown.enter)="entrar()">
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-wide">
      <mat-label>Senha</mat-label>
      <input matInput type="password" [(ngModel)]="senha" (keydown.enter)="entrar()">
    </mat-form-field>

    <div class="form-actions">
      <button mat-flat-button class="primary-btn" (click)="entrar()">Entrar</button>
    </div>

    <p class="login-hint">Acesso simulado: use qualquer usuário e senha para entrar.</p>
  </div>
</section>
