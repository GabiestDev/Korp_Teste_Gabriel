<section class="page-card">
  <div class="page-header">
    <h2>Gestão de Produtos</h2>
  </div>

  <div class="toolbar-row">
    <mat-form-field appearance="outline" class="field">
      <mat-label>Código</mat-label>
      <input matInput [(ngModel)]="novoCodigo">
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-wide">
      <mat-label>Descrição</mat-label>
      <input matInput [(ngModel)]="novaDescricao">
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Saldo</mat-label>
      <input matInput type="number" min="0" [(ngModel)]="novoSaldo">
    </mat-form-field>

    <div class="form-actions">
      <button mat-flat-button class="primary-btn" (click)="criarProduto()" style="background: linear-gradient(135deg, #2b485a 0%, #203739 100%) !important; color: #fff !important; border: none !important;">
        Cadastrar Produto
      </button>
    </div>
  </div>

  @if (produtos().length === 0) {
    <p class="empty-state">Nenhum produto cadastrado ainda.</p>
  } @else {
    <div class="table-wrap">
      <table mat-table [dataSource]="produtos()" class="mat-elevation-z0">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef> Código </th>
          <td mat-cell *matCellDef="let p"> {{ p.codigo }} </td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let p"> {{ p.descricao }} </td>
        </ng-container>

        <ng-container matColumnDef="saldo">
          <th mat-header-cell *matHeaderCellDef> Saldo </th>
          <td mat-cell *matCellDef="let p"> {{ p.saldo }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
      </table>
    </div>
  }
</section>
